<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car For Sale Simulator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:#87ceeb;
}

#game{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(#6ec6ff,#8bd66b);
}

.sky{
position:absolute;
width:100%;
height:70%;
background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1400&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.road{
position:absolute;
bottom:0;
width:100%;
height:30%;
background:#2f2f2f;
}

.line{
position:absolute;
top:50%;
width:140px;
height:10px;
background:white;
animation:moveRoad 1s linear infinite;
}

.line:nth-child(1){left:0px;}
.line:nth-child(2){left:220px;}
.line:nth-child(3){left:440px;}
.line:nth-child(4){left:660px;}
.line:nth-child(5){left:880px;}
.line:nth-child(6){left:1100px;}

@keyframes moveRoad{
0%{transform:translateX(0);}
100%{transform:translateX(-220px);}
}

.car{
position:absolute;
bottom:70px;
left:120px;
width:220px;
transition:0.1s;
}

.enemy{
position:absolute;
bottom:70px;
right:-300px;
width:220px;
}

.title{
position:absolute;
top:20px;
left:20px;
font-size:55px;
font-weight:bold;
color:white;
text-shadow:3px 3px 10px black;
}

.score{
position:absolute;
top:100px;
left:25px;
font-size:35px;
color:yellow;
font-weight:bold;
text-shadow:2px 2px 10px black;
}

.gameover{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
font-weight:bold;
color:white;
display:none;
text-align:center;
text-shadow:4px 4px 10px black;
}

.restart{
padding:15px 40px;
font-size:30px;
margin-top:20px;
border:none;
border-radius:10px;
cursor:pointer;
}

.controls{
position:absolute;
bottom:10px;
width:100%;
display:flex;
justify-content:center;
gap:30px;
}

.btn{
width:90px;
height:90px;
font-size:40px;
border:none;
border-radius:50%;
background:white;
box-shadow:0 0 15px black;
}

@media(max-width:700px){

.car,.enemy{
width:150px;
}

.title{
font-size:35px;
}

.score{
font-size:25px;
}

.btn{
width:70px;
height:70px;
}

}

</style>
</head>

<body>

<div id="game">

<div class="sky"></div>

<div class="title">CAR FOR SALE</div>

<div class="score">
Money: $<span id="score">0</span>
</div>

<img class="car" id="player"
src="https://pngimg.com/uploads/porsche/porsche_PNG10627.png">

<img class="enemy" id="enemy"
src="https://pngimg.com/uploads/bmw/bmw_PNG1711.png">

<div class="road">

<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>

</div>

<div class="controls">

<button class="btn" onclick="left()">⬅</button>

<button class="btn" onclick="right()">➡</button>

</div>

<div class="gameover" id="gameover">

CRASHED!

<br>

<button class="restart" onclick="location.reload()">
RESTART
</button>

</div>

</div>

<script>

let player=document.getElementById("player");
let enemy=document.getElementById("enemy");
let score=document.getElementById("score");
let gameover=document.getElementById("gameover");

let playerX=120;
let enemyX=window.innerWidth+200;

let points=0;
let speed=12;

function left(){

if(playerX>0){

playerX-=45;

player.style.left=playerX+"px";

}

}

function right(){

if(playerX<window.innerWidth-220){

playerX+=45;

player.style.left=playerX+"px";

}

}

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowLeft") left();

if(e.key==="ArrowRight") right();

});

function loop(){

enemyX-=speed;

enemy.style.left=enemyX+"px";

if(enemyX<-300){

enemyX=window.innerWidth+300;

points+=100;

score.innerHTML=points;

speed+=0.3;

enemy.style.bottom=(60+Math.random()*40)+"px";

}

let p=player.getBoundingClientRect();

let e=enemy.getBoundingClientRect();

if(

p.left<e.right &&
p.right>e.left &&
p.top<e.bottom &&
p.bottom>e.top

){

gameover.style.display="block";

return;

}

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
