<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Shooter Game</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    z-index:10;
    font-family:Arial;
}

</style>
</head>

<body>

<div id="info">Kills: 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

let scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

let renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(window.innerWidth,window.innerHeight);

document.body.appendChild(renderer.domElement);

/* Light */

let light = new THREE.DirectionalLight(0xffffff,1);

light.position.set(5,10,7);

scene.add(light);

/* Ground */

let groundGeo = new THREE.PlaneGeometry(100,100);

let groundMat = new THREE.MeshStandardMaterial({
color:0x222222
});

let ground = new THREE.Mesh(groundGeo,groundMat);

ground.rotation.x = -Math.PI/2;

scene.add(ground);

/* Player */

let playerGeo = new THREE.BoxGeometry(1,1,1);

let playerMat = new THREE.MeshStandardMaterial({
color:0x00ffcc
});

let player = new THREE.Mesh(playerGeo,playerMat);

player.position.y = 0.5;

scene.add(player);

camera.position.set(0,5,8);

camera.lookAt(player.position);

/* Bullets */

let bullets = [];

/* Enemies */

let enemies = [];

let kills = 0;

function createEnemy(){

    let geo = new THREE.BoxGeometry(1,1,1);

    let mat = new THREE.MeshStandardMaterial({
        color:0xff0000
    });

    let enemy = new THREE.Mesh(geo,mat);

    enemy.position.set(
        (Math.random()-0.5)*20,
        0.5,
        -20
    );

    scene.add(enemy);

    enemies.push(enemy);

}

setInterval(createEnemy,1500);

/* Shoot */

window.addEventListener("click",()=>{

    let geo = new THREE.SphereGeometry(0.2);

    let mat = new THREE.MeshBasicMaterial({
        color:0xffff00
    });

    let bullet = new THREE.Mesh(geo,mat);

    bullet.position.copy(player.position);

    scene.add(bullet);

    bullets.push(bullet);

});

/* Controls */

window.addEventListener("touchmove",(e)=>{

    let x = (e.touches[0].clientX/window.innerWidth - 0.5)*20;

    player.position.x = x;

});

/* Animate */

function animate(){

    requestAnimationFrame(animate);

    bullets.forEach((b,bi)=>{

        b.position.z -= 0.7;

        if(b.position.z < -50){

            scene.remove(b);

            bullets.splice(bi,1);

        }

    });

    enemies.forEach((e,ei)=>{

        e.position.z += 0.05;

        if(e.position.z > 5){

            alert("Game Over");

            location.reload();

        }

        bullets.forEach((b,bi)=>{

            let dist = b.position.distanceTo(e.position);

            if(dist < 1){

                scene.remove(e);
                scene.remove(b);

                enemies.splice(ei,1);
                bullets.splice(bi,1);

                kills++;

                document.getElementById("info").innerText =
                "Kills: " + kills;

            }

        });

    });

    renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
