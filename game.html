<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car For Sale Game</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    overflow:hidden;
} 

header{
    background:#0f172a;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#00ffd5;
}

#money{
    position:absolute;
    top:70px;
    left:20px;
    font-size:24px;
    background:#1e293b;
    padding:10px 20px;
    border-radius:12px;
}

.game{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    flex-wrap:wrap;
    margin-top:120px;
}

.card{
    width:260px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,255,213,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h2{
    margin:0;
    color:#00ffd5;
}

.price{
    margin:10px 0;
    font-size:22px;
    font-weight:bold;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#00ffd5;
    color:black;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:white;
}

#garage{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0f172a;
    padding:15px;
}

#garage h3{
    margin:0 0 10px;
    color:#00ffd5;
}

#carsOwned{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.carTag{
    background:#1e293b;
    padding:8px 15px;
    border-radius:10px;
}
</style>
</head>
<body>

<header>PC Car For Sale Game</header>

<div id="money">Money: $50000</div>

<div class="game">

<div class="card">
<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200">
<div class="card-content">
<h2>BMW M4</h2>
<div class="price">$15000</div>
<button onclick="buyCar('BMW M4',15000)">Buy Car</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1200">
<div class="card-content">
<h2>Lamborghini</h2>
<div class="price">$30000</div>
<button onclick="buyCar('Lamborghini',30000)">Buy Car</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1200">
<div class="card-content">
<h2>Porsche 911</h2>
<div class="price">$25000</div>
<button onclick="buyCar('Porsche 911',25000)">Buy Car</button>
</div>
</div>

</div>

<div id="garage">
<h3>Your Garage</h3>
<div id="carsOwned"></div>
</div>

<script>

let money = 50000;
let ownedCars = [];

function updateMoney(){
    document.getElementById('money').innerText = 'Money: $' + money;
}

function buyCar(name, price){

    if(money >= price){

        money -= price;

        ownedCars.push(name);

        updateMoney();

        let tag = document.createElement('div');
        tag.className = 'carTag';
        tag.innerText = name;

        document.getElementById('carsOwned').appendChild(tag);

        alert(name + ' Purchased Successfully!');

    }else{

        alert('Not enough money!');

    }

}

</script>

</body>
</html>
