<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car For Sale Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:#6ec6ff;
}

#game{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(#6ec6ff,#9be15d);
}

.road{
position:absolute;
bottom:0;
width:100%;
height:220px;
background:#333;
}

.line{
position:absolute;
width:120px;
height:10px;
background:white;
top:50%;
animation:road 1s linear infinite;
}

.line:nth-child(1){left:0;}
.line:nth-child(2){left:200px;}
.line:nth-child(3){left:400px;}
.line:nth-child(4){left:600px;}
.line:nth-child(5){left:800px;}
.line:nth-child(6){left:1000px;}

@keyframes road{
0%{transform:translateX(0);}
100%{transform:translateX(-200px);}
}

.player{
width:120px;
height:60px;
background:red;
position:absolute;
bottom:90px;
left:200px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.player::before{
content:'';
position:absolute;
width:80px;
height:35px;
background:#b30000;
top:-25px;
left:20px;
border-radius:15px;
}

.wheel{
width:30px;
height:30px;
background:black;
border-radius:50%;
position:absolute;
bottom:-15px;
}

.w1{left:10px;}
.w2{right:10px;}

.enemy{
width:120px;
height:60px;
background:blue;
position:absolute;
bottom:90px;
right:-150px;
border-radius:20px;
}

.enemy::before{
content:'';
position:absolute;
width:80px;
height:35px;
background:#0033cc;
top:-25px;
left:20px;
border-radius:15px;
}

.score{
position:absolute;
top:20px;
left:20px;
font-size:35px;
color:white;
font-weight:bold;
text-shadow:2px 2px 5px black;
}

.title{
position:absolute;
top:20px;
right:20px;
font-size:40px;
font-weight:bold;
color:yellow;
text-shadow:2px 2px 5px black;
}

.controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:center;
gap:20px;
}

.btn{
width:90px;
height:90px;
border:none;
border-radius:50%;
font-size:40px;
background:white;
box-shadow:0 0 10px black;
}

.gameover{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
color:white;
display:none;
text-align:center;
text-shadow:3px 3px 10px black;
}
</style>
</head>
<body>

<div id="game">

<div class="score">Score: <span id="score">0</span></div>

<div class="title">CAR FOR SALE</div>

<div class="player" id="player">
<div class="wheel w1"></div>
<div class="wheel w2"></div>
</div>

<div class="enemy" id="enemy">
<div class="wheel w1"></div>
<div class="wheel w2"></div>
</div>

<div class="road">
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
</div>

<div class="controls">
<button class="btn" onclick="moveLeft()">⬅</button>
<button class="btn" onclick="moveRight()">➡</button>
</div>

<div class="gameover" id="gameover">
GAME OVER<br>
<button onclick="location.reload()" style="padding:15px 30px;font-size:25px;margin-top:20px;">
Restart
</button>
</div>

</div>

<script>

let player=document.getElementById("player");
let enemy=document.getElementById("enemy");
let score=document.getElementById("score");
let gameover=document.getElementById("gameover");

let playerX=200;
let enemyX=window.innerWidth;
let points=0;

function moveLeft(){
if(playerX>20){
playerX-=40;
player.style.left=playerX+"px";
}
}

function moveRight(){
if(playerX<window.innerWidth-150){
playerX+=40;
player.style.left=playerX+"px";
}
}

document.addEventListener("keydown",(e)=>{
if(e.key==="ArrowLeft") moveLeft();
if(e.key==="ArrowRight") moveRight();
});

function gameLoop(){

enemyX-=12;

if(enemyX<-150){
enemyX=window.innerWidth;
points++;
score.innerHTML=points;

enemy.style.background=
"#"+Math.floor(Math.random()*16777215).toString(16);
}

enemy.style.left=enemyX+"px";

let playerRect=player.getBoundingClientRect();
let enemyRect=enemy.getBoundingClientRect();

if(
playerRect.left<enemyRect.right &&
playerRect.right>enemyRect.left &&
playerRect.top<enemyRect.bottom &&
playerRect.bottom>enemyRect.top
){
gameover.style.display="block";
return;
}

requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
