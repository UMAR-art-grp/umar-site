<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Royale Mobile Game</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
}

canvas{
    display:block;
    background:#1b1b1b;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    z-index:10;
}

#gameover{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    display:none;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="score">Kills: 0</div>

<div id="gameover">
    <h1>Game Over</h1>
    <button onclick="location.reload()">Restart</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let kills = 0;

const player = {
    x: canvas.width/2,
    y: canvas.height/2,
    size: 22,
    color:"#00ff99",
    speed:5,
    health:100
};

let bullets = [];
let enemies = [];

function drawPlayer(){

    ctx.fillStyle = player.color;

    ctx.beginPath();
    ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
    ctx.fill();

}

function drawBullets(){

    ctx.fillStyle = "yellow";

    bullets.forEach((b,i)=>{

        b.x += b.dx;
        b.y += b.dy;

        ctx.fillRect(b.x,b.y,8,8);

        if(
            b.x < 0 ||
            b.x > canvas.width ||
            b.y < 0 ||
            b.y > canvas.height
        ){
            bullets.splice(i,1);
        }

    });

}

function spawnEnemy(){

    let side = Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=0;
        y=Math.random()*canvas.height;
    }

    if(side===1){
        x=canvas.width;
        y=Math.random()*canvas.height;
    }

    if(side===2){
        x=Math.random()*canvas.width;
        y=0;
    }

    if(side===3){
        x=Math.random()*canvas.width;
        y=canvas.height;
    }

    enemies.push({
        x,
        y,
        size:20,
        speed:1.5 + Math.random()*2
    });

}

setInterval(spawnEnemy,1000);

function drawEnemies(){

    ctx.fillStyle = "red";

    enemies.forEach((e,ei)=>{

        let angle = Math.atan2(player.y-e.y, player.x-e.x);

        e.x += Math.cos(angle)*e.speed;
        e.y += Math.sin(angle)*e.speed;

        ctx.beginPath();
        ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
        ctx.fill();

        let distPlayer = Math.hypot(player.x-e.x, player.y-e.y);

        if(distPlayer < player.size + e.size){

            document.getElementById("gameover").style.display="block";

        }

        bullets.forEach((b,bi)=>{

            let dist = Math.hypot(b.x-e.x, b.y-e.y);

            if(dist < e.size){

                enemies.splice(ei,1);
                bullets.splice(bi,1);

                kills++;

                document.getElementById("score").innerText =
                "Kills: " + kills;

            }

        });

    });

}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawPlayer();
    drawBullets();
    drawEnemies();

    requestAnimationFrame(animate);

}

animate();

canvas.addEventListener("touchmove",(e)=>{

    player.x = e.touches[0].clientX;
    player.y = e.touches[0].clientY;

});

canvas.addEventListener("touchstart",(e)=>{

    let touchX = e.touches[0].clientX;
    let touchY = e.touches[0].clientY;

    let angle = Math.atan2(
        touchY-player.y,
        touchX-player.x
    );

    bullets.push({
        x:player.x,
        y:player.y,
        dx:Math.cos(angle)*8,
        dy:Math.sin(angle)*8
    });

});

</script>

</body>
</html>
