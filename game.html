<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD Battle Shooter</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    font-size:22px;
    z-index:10;
}

#crosshair{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:40px;
    z-index:10;
}

</style>
</head>

<body>

<div id="hud">Kills: 0</div>
<div id="crosshair">+</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x101820);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

/* Lights */

const light = new THREE.DirectionalLight(0xffffff,2);

light.position.set(10,20,10);

scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.5);

scene.add(ambient);

/* Floor */

const floorGeo = new THREE.PlaneGeometry(200,200);

const floorMat = new THREE.MeshStandardMaterial({
color:0x222222
});

const floor = new THREE.Mesh(floorGeo,floorMat);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

/* Player */

camera.position.set(0,2,8);

/* Enemies */

let enemies = [];

let bullets = [];

let kills = 0;

function createEnemy(){

    const geo = new THREE.BoxGeometry(2,2,2);

    const mat = new THREE.MeshStandardMaterial({
        color:0xff0000
    });

    const enemy = new THREE.Mesh(geo,mat);

    enemy.position.set(
        (Math.random()-0.5)*30,
        1,
        -50
    );

    scene.add(enemy);

    enemies.push(enemy);

}

setInterval(createEnemy,1200);

/* Shoot */

window.addEventListener("click",()=>{

    const geo = new THREE.SphereGeometry(0.25,32,32);

    const mat = new THREE.MeshBasicMaterial({
        color:0xffff00
    });

    const bullet = new THREE.Mesh(geo,mat);

    bullet.position.set(0,2,8);

    scene.add(bullet);

    bullets.push(bullet);

});

/* Touch movement */

window.addEventListener("touchmove",(e)=>{

    let moveX =
    (e.touches[0].clientX/window.innerWidth - 0.5)*20;

    camera.position.x = moveX;

});

/* Animate */

function animate(){

    requestAnimationFrame(animate);

    bullets.forEach((b,bi)=>{

        b.position.z -= 1.5;

        if(b.position.z < -100){

            scene.remove(b);

            bullets.splice(bi,1);

        }

    });

    enemies.forEach((e,ei)=>{

        e.position.z += 0.08;

        e.rotation.x += 0.01;

        e.rotation.y += 0.01;

        if(e.position.z > 10){

            alert("Game Over");

            location.reload();

        }

        bullets.forEach((b,bi)=>{

            let dist = b.position.distanceTo(e.position);

            if(dist < 1.5){

                scene.remove(e);

                scene.remove(b);

                enemies.splice(ei,1);

                bullets.splice(bi,1);

                kills++;

                document.getElementById("hud").innerText =
                "Kills: " + kills;

            }

        });

    });

    renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
