# Real 3D Car Game Code

Save this file as `index.html`

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Car Game</title>
<style>
body{
margin:0;
overflow:hidden;
background:black;
}

#info{
position:absolute;
top:20px;
left:20px;
color:white;
font-size:30px;
font-family:Arial;
z-index:100;
}

button{
position:absolute;
bottom:20px;
width:80px;
height:80px;
font-size:40px;
border:none;
border-radius:50%;
z-index:100;
}

#left{
left:20px;
}

#right{
right:20px;
}
</style>
</head>
<body>

<div id="info">3D CAR GAME</div>

<button id="left">⬅</button>
<button id="right">➡</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(0,10,10);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);

const roadGeometry = new THREE.BoxGeometry(12,0.1,200);
const roadMaterial = new THREE.MeshStandardMaterial({color:0x333333});
const road = new THREE.Mesh(roadGeometry,roadMaterial);
scene.add(road);

const lineGeometry = new THREE.BoxGeometry(0.3,0.05,4);
const lineMaterial = new THREE.MeshStandardMaterial({color:0xffffff});

for(let i=-90;i<100;i+=10){
const line = new THREE.Mesh(lineGeometry,lineMaterial);
line.position.z=i;
line.position.y=0.06;
scene.add(line);
}

const playerGeometry = new THREE.BoxGeometry(1.5,1,3);
const playerMaterial = new THREE.MeshStandardMaterial({color:0xff0000});
const player = new THREE.Mesh(playerGeometry,playerMaterial);
player.position.y=0.7;
player.position.z=20;
scene.add(player);

const enemyGeometry = new THREE.BoxGeometry(1.5,1,3);
const enemyMaterial = new THREE.MeshStandardMaterial({color:0x0000ff});
const enemy = new THREE.Mesh(enemyGeometry,enemyMaterial);
enemy.position.y=0.7;
enemy.position.z=-40;
scene.add(enemy);

camera.position.set(0,6,28);
camera.rotation.x=-0.2;

let speed=0.6;

function moveLeft(){
if(player.position.x>-4){
player.position.x-=1;
}
}

function moveRight(){
if(player.position.x<4){
player.position.x+=1;
}
}

document.getElementById('left').onclick=moveLeft;
document.getElementById('right').onclick=moveRight;

window.addEventListener('keydown',(e)=>{
if(e.key==='ArrowLeft') moveLeft();
if(e.key==='ArrowRight') moveRight();
});

function animate(){
requestAnimationFrame(animate);

enemy.position.z += speed;

if(enemy.position.z>30){
enemy.position.z=-50;
enemy.position.x=(Math.random()*8)-4;
}

if(
Math.abs(player.position.x-enemy.position.x)<1.5 &&
Math.abs(player.position.z-enemy.position.z)<2
){
alert('Game Over');
location.reload();
}

renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
```
